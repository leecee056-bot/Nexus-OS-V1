; Tri-Cass Cardputer ADV — M5Stack ESP32-S3FN8 pocket firmware
; 8 MB flash · ~512 KB SRAM · NO PSRAM · 240×135 display · 56-key keyboard

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DNEXUS_CARDPUTER_ADV=1
  -O2
  ; Explicitly no PSRAM — Stamp-S3A / ESP32-S3FN8 has none
  -UBOARD_HAS_PSRAM
lib_deps =
  m5stack/M5Unified @ ^0.2.7
  m5stack/M5GFX @ ^0.2.7
  m5stack/M5Cardputer @ ^1.1.0
lib_ldf_mode = deep+
