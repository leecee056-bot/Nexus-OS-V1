; NEXUS Pocket — ESP32-S3 offline tiny AI companion
; Primary target: ESP32-S3 N16R8 (16 MB flash, 8 MB OPI PSRAM)

[env:nexus-pocket-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -O2
  -DCORE_DEBUG_LEVEL=1

; Optional: boards with 8 MB flash / 8 MB PSRAM (XIAO S3 etc.) — smaller FS for model
[env:nexus-pocket-s3-8mb]
extends = env:nexus-pocket-s3
board_upload.flash_size = 8MB
board_build.partitions = partitions-8mb.csv
build_flags =
  ${env:nexus-pocket-s3.build_flags}
  -DNEXUS_FLASH_8MB=1
