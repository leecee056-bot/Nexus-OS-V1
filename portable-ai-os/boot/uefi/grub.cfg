# Tri-Cass OS — UEFI GRUB menu (HAP-64)
# Installed to the ESP as EFI/tri-cass/grub.cfg and referenced from shim→grub.
set timeout=5
set default=0

insmod part_gpt
insmod fat
insmod ext2
insmod gzio
insmod all_video

search --no-floppy --set=root --label AI_SYS

menuentry "Tri-Cass OS" {
  linux /boot/vmlinuz root=LABEL=AI_SYS rw quiet console=tty0
  initrd /boot/initrd.img
}

menuentry "Tri-Cass OS (serial console)" {
  linux /boot/vmlinuz root=LABEL=AI_SYS rw console=tty0 console=ttyS0,115200n8
  initrd /boot/initrd.img
}
