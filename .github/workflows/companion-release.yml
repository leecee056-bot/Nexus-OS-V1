name: Companion release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web --output-dir dist-web
      - run: npm install --no-save electron electron-builder @electron/asar
      - run: npx electron-builder --win portable nsis dir --x64 --config electron-builder.yml
      # Upload first so a verify flake never leaves Download buttons on a 404.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: nexus-app/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-windows
          path: |
            nexus-app/release/*.exe
            nexus-app/release/win-unpacked/**
      - name: Verify Electron shell is packaged
        shell: bash
        run: |
          set -euo pipefail
          ASAR="release/win-unpacked/resources/app.asar"
          UNPACKED="release/win-unpacked/resources/app.asar.unpacked"
          test -f "$ASAR"
          # asarUnpack puts electron/* on disk (not only inside the asar list)
          MAIN=""
          for candidate in \
            "$UNPACKED/electron/main.js" \
            "release/win-unpacked/resources/app.asar.unpacked/electron/main.js"
          do
            if [ -f "$candidate" ]; then MAIN="$candidate"; break; fi
          done
          if [ -z "$MAIN" ]; then
            # Fallback: still inside asar
            npx --yes @electron/asar extract-file "$ASAR" electron/main.js /tmp/main-check.js
            MAIN=/tmp/main-check.js
          fi
          test -f "$MAIN"
          echo "Using main.js at $MAIN"
          for name in portable.js preload.js browse-shell.html browse-preload.js; do
            if [ -f "$UNPACKED/electron/$name" ]; then
              echo "ok unpacked electron/$name"
            elif npx --yes @electron/asar list "$ASAR" | grep -E "/electron/$name\$" >/dev/null; then
              echo "ok asar electron/$name"
            else
              echo "FAIL: missing electron/$name"
              exit 1
            fi
          done
          if grep -nE "require\([\"']\\./browsers" "$MAIN"; then
            echo "FAIL: main.js still requires ./browsers"
            exit 1
          fi
          # Must NOT ship the Expo node_modules tree (was ~25k files)
          count=$(npx --yes @electron/asar list "$ASAR" | grep -cE '^/node_modules/' || true)
          echo "node_modules entries in asar: $count"
          if [ "${count:-0}" -gt 50 ]; then
            echo "FAIL: asar still contains $count node_modules files"
            exit 1
          fi
          echo "Packaging verify OK"

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web --output-dir dist-web
      - run: npm install --no-save electron electron-builder
      - run: npx electron-builder --mac dmg zip --x64 --arm64 --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexus-app/release/*.dmg
            nexus-app/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-mac
          path: |
            nexus-app/release/*.dmg
            nexus-app/release/*.zip

  usb-kit:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: nexus-companion-windows
          path: nexus-app/release
      - uses: actions/download-artifact@v4
        with:
          name: nexus-companion-mac
          path: nexus-app/release
      - name: Pack USB kit zip
        run: |
          mkdir -p release
          # Flatten if artifact nested win-unpacked
          if [ ! -d release/win-unpacked ] && [ -d release/nexus-app/release/win-unpacked ]; then
            mv release/nexus-app/release/* release/ 2>/dev/null || true
          fi
          ls -laR release | head -80
          node scripts/pack-usb-kit.mjs
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: nexus-app/release/Tri-Cass-Companion-USB-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-usb-kit
          path: nexus-app/release/Tri-Cass-Companion-USB-*.zip

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted runners already ship an Android SDK; avoid
      # android-actions/setup-android (breaks on missing legacy `tools` package).
      - name: Accept Android licenses + ensure platform packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/tmp/sdk-licenses.txt || \
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          CMD="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            # Fall back to any cmdline-tools/*/bin/sdkmanager on the runner
            CMD="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager=$CMD"
          yes | "$CMD" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          yes | "$CMD" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - name: Build sideload APK (local Gradle — no EXPO_TOKEN)
        run: |
          chmod +x scripts/build-android-apk.sh
          ./scripts/build-android-apk.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          # On manual dispatch, attach to the current Companion release tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'companion-v0.12.4' || github.ref_name }}
          files: nexus-app/release/Tri-Cass-Companion-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-android
          path: nexus-app/release/Tri-Cass-Companion-Android-*.apk
