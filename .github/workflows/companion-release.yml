name: Companion release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web --output-dir dist-web
      - run: npm install --no-save electron electron-builder
      - run: npx electron-builder --win portable dir --x64 --config electron-builder.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: nexus-app/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-windows
          path: |
            nexus-app/release/*.exe
            nexus-app/release/win-unpacked/**

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - run: npm ci
      - run: npx expo export -p web --output-dir dist-web
      - run: npm install --no-save electron electron-builder
      - run: npx electron-builder --mac dmg zip --x64 --arm64 --config electron-builder.yml
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            nexus-app/release/*.dmg
            nexus-app/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-mac
          path: |
            nexus-app/release/*.dmg
            nexus-app/release/*.zip

  usb-kit:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: nexus-companion-windows
          path: nexus-app/release
      - uses: actions/download-artifact@v4
        with:
          name: nexus-companion-mac
          path: nexus-app/release
      - name: Pack USB kit zip
        run: |
          mkdir -p release
          # Flatten if artifact nested win-unpacked
          if [ ! -d release/win-unpacked ] && [ -d release/nexus-app/release/win-unpacked ]; then
            mv release/nexus-app/release/* release/ 2>/dev/null || true
          fi
          ls -laR release | head -80
          node scripts/pack-usb-kit.mjs
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: nexus-app/release/NEXUS-Companion-USB-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-usb-kit
          path: nexus-app/release/NEXUS-Companion-USB-*.zip

  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexus-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nexus-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted runners already ship an Android SDK; avoid
      # android-actions/setup-android (breaks on missing legacy `tools` package).
      - name: Accept Android licenses + ensure platform packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/tmp/sdk-licenses.txt || \
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          CMD="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$CMD" ]; then
            # Fall back to any cmdline-tools/*/bin/sdkmanager on the runner
            CMD="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          echo "Using sdkmanager=$CMD"
          yes | "$CMD" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          yes | "$CMD" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - run: npm ci
      - name: Build sideload APK (local Gradle — no EXPO_TOKEN)
        run: |
          chmod +x scripts/build-android-apk.sh
          ./scripts/build-android-apk.sh
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          # On manual dispatch, attach to the current Companion release tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && 'companion-v0.12.1' || github.ref_name }}
          files: nexus-app/release/NEXUS-Companion-Android-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-companion-android
          path: nexus-app/release/NEXUS-Companion-Android-*.apk
