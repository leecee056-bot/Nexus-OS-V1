appId: bot.grok.nexus.companion
productName: NEXUS Companion
copyright: Copyright © 2026 NEXUS OS
directories:
  output: release
  buildResources: assets/brand
files:
  # Include the whole Electron shell (Browse + desktop launcher modules).
  - electron/**/*
  - dist-web/**/*
  - assets/brand/icon.png
  - assets/brand/icon.ico
  - assets/brand/icon.icns
  - assets/brand/logo-mark.png
  - package.json
extraMetadata:
  main: electron/main.js
extraResources: []
win:
  # 512 PNG — electron-builder converts to ICO (≥256 required)
  icon: icon.png
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: dir
      arch:
        - x64
portable:
  # Persist next to the .exe when used outside a full kit
  requestExecutionLevel: user
  artifactName: NEXUS-Companion-Windows-${version}-portable.exe
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: NEXUS Companion
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  runAfterFinish: true
  artifactName: NEXUS-Companion-Windows-${version}-setup.exe
mac:
  icon: icon.icns
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: NEXUS-Companion-Mac-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  icon: icon.png
  target:
    - AppImage
  artifactName: NEXUS-Companion-Linux-${version}.${ext}
